services:
  koranku-fe:
    container_name: koranku-fe
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/koranku/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: koranku-fe:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal/koranku/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apigateway_internal_network

networks:
  apigateway_internal_network:
    external: true
