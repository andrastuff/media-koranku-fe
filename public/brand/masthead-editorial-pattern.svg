<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".52" stop-color="#f2f6fb"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <pattern id="editorialGrid" width="96" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 47.5h96" stroke="#b7c6d9" stroke-width="1" opacity=".22"/>
      <path d="M95.5 0v48" stroke="#b7c6d9" stroke-width="1" opacity=".14"/>
      <circle cx="12" cy="12" r="1" fill="#052962" opacity=".12"/>
    </pattern>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dbe7f3" stop-opacity=".52"/>
      <stop offset="1" stop-color="#dbe7f3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="1" y1="0" x2="0" y2="0">
      <stop stop-color="#dbe7f3" stop-opacity=".52"/>
      <stop offset="1" stop-color="#dbe7f3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="240" fill="url(#wash)"/>
  <rect width="1600" height="240" fill="url(#editorialGrid)"/>

  <!-- Abstract newspaper columns, kept at the outer edges. -->
  <g fill="none" stroke="#7890ae" opacity=".14">
    <rect x="28" y="30" width="210" height="180" rx="8"/>
    <path d="M48 58h94M48 76h166M48 94h132M48 128h166M48 146h146M48 164h166"/>
    <rect x="157" y="53" width="57" height="47" rx="3" fill="#c9d7e7" stroke="none"/>

    <rect x="1362" y="30" width="210" height="180" rx="8"/>
    <path d="M1382 58h94M1382 76h166M1382 94h132M1382 128h166M1382 146h146M1382 164h166"/>
    <rect x="1491" y="53" width="57" height="47" rx="3" fill="#c9d7e7" stroke="none"/>
  </g>

  <rect width="320" height="240" fill="url(#fadeLeft)" opacity=".16"/>
  <rect x="1280" width="320" height="240" fill="url(#fadeRight)" opacity=".16"/>

  <!-- Restrained brand accents inspired by editorial rules. -->
  <path d="M0 15h280" stroke="#052962" stroke-width="2" opacity=".08"/>
  <path d="M1320 225h280" stroke="#052962" stroke-width="2" opacity=".08"/>
  <path d="M0 19h105" stroke="#c91825" stroke-width="3" opacity=".3"/>
  <path d="M1495 221h105" stroke="#c91825" stroke-width="3" opacity=".3"/>
</svg>
